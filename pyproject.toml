[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-ci"
version = "0.1.0"
description = "Automated adversarial testing harness for RAG and agent systems, integrated with CI quality gates."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
